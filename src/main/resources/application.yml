# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    root: INFO
    com:
      fedex: DEBUG

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Okta OpenID Connect bearer-token validation (resource server)
spring:
  application:
    name: shipmentAPI
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OKTA_ISSUER}
  web:
    error:
      include-message: always
      include-binding-errors: always
      include-stacktrace: never
      include-exception: false